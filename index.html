<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Academic portfolio of Suhaila Bahrom, Matriculation Lecturer, Department of Mathematics, Centre for Foundation Studies, International Islamic University Malaysia.">
<meta name="color-scheme" content="light dark">
<title>Suhaila Bahrom | Academic Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<script>
  (function () {
    document.documentElement.classList.add('js');
    try {
      var saved = localStorage.getItem('sb-theme');
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (dark ? 'dark' : 'light'));
    } catch (e) { /* storage unavailable: keep default theme */ }
  })();
</script>
<style>
/* ==========================================================================
   Suhaila Bahrom — Academic Portfolio
   Palette: Midnight #0B1437 · Blue #315EE7 · Gold #D4AF37 · White #FFFFFF
            Ice #F5F7FC · Text #17233B · Secondary text #50597A
   ========================================================================== */

:root {
  --midnight: #0B1437;
  --blue: #315EE7;
  --gold: #D4AF37;
  --gold-ink: #7A5C00;
  --white: #FFFFFF;
  --ice: #F5F7FC;
  --ink: #17233B;
  --muted: #50597A;
  --line: #E1E6F2;
  --surface: #FFFFFF;
  --bg: #F5F7FC;
  --accent: #315EE7;
  --link: #2549C7;
  --shadow: 0 1px 2px rgba(11, 20, 55, .05), 0 14px 36px -24px rgba(11, 20, 55, .28);
  --radius: 18px;
  --font-head: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #070E26;
  --surface: #0F1A3F;
  --ink: #EEF2FF;
  --muted: #AEB8D6;
  --line: #22305E;
  --accent: #5C82F5;
  --link: #9DBBFF;
  --gold-ink: #E9CD6A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 18px 40px -24px rgba(0, 0, 0, .75);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
img { max-width: 100%; display: block; }
a { color: var(--link); text-underline-offset: 3px; }
h1, h2, h3, h4 {
  font-family: var(--font-head);
  line-height: 1.2;
  margin: 0 0 .5em;
  letter-spacing: -.01em;
  color: var(--ink);
  overflow-wrap: anywhere;
}
h1 { font-size: clamp(2.1rem, 4.4vw, 3.4rem); font-weight: 800; }
h2 { font-size: clamp(1.3rem, 2.3vw, 1.7rem); font-weight: 700; }
h3 { font-size: 1.12rem; font-weight: 700; }
h4 { font-size: 1rem; font-weight: 700; }
p { margin: 0 0 .9em; }
ul { margin: 0; }
.muted { color: var(--muted); }
.fine { font-size: .86rem; color: var(--muted); }
.pending { color: var(--muted); font-style: italic; }
.num {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: .8rem;
  letter-spacing: .14em;
  color: var(--gold-ink);
  text-transform: uppercase;
}

.skip {
  position: absolute; left: -999px; top: 8px; z-index: 100;
  background: var(--gold); color: var(--midnight);
  padding: 8px 14px; border-radius: 8px; font-weight: 700;
}
.skip:focus { left: 12px; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
main:focus { outline: none; }

/* ---------- Ambient background: gradient glow, floating rings, cursor light ---------- */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background:
    radial-gradient(60vmax 60vmax at 88% -8%, rgba(212, 175, 55, .26), transparent 60%),
    radial-gradient(55vmax 55vmax at -8% 108%, rgba(49, 94, 231, .10), transparent 62%),
    linear-gradient(165deg, #FFFDF6 0%, #F5F7FC 55%, #EDF1FB 100%);
}
[data-theme="dark"] body::before {
  background:
    radial-gradient(60vmax 60vmax at 88% -8%, rgba(212, 175, 55, .20), transparent 60%),
    radial-gradient(55vmax 55vmax at -8% 108%, rgba(49, 94, 231, .28), transparent 62%),
    linear-gradient(165deg, #0E1A4A 0%, #0B1437 50%, #060C22 100%);
}
.bg-rings { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.bg-rings span { position: absolute; border-radius: 50%; border: 1px solid rgba(212, 175, 55, .24); }
.bg-rings span:nth-child(1) {
  width: 70vmax; height: 70vmax; right: -22vmax; top: -30vmax;
  animation: spin 90s linear infinite;
}
.bg-rings span:nth-child(1)::after {
  content: ""; position: absolute; top: -5px; left: 50%; width: 10px; height: 10px;
  margin-left: -5px; border-radius: 50%; background: var(--gold);
  box-shadow: 0 0 18px 4px rgba(212, 175, 55, .55);
}
.bg-rings span:nth-child(2) {
  width: 46vmax; height: 46vmax; right: -8vmax; top: -14vmax;
  border-style: dashed; border-color: rgba(49, 94, 231, .20);
  animation: spin 60s linear infinite reverse;
}
.bg-rings span:nth-child(3) {
  width: 26vmax; height: 26vmax; left: -10vmax; bottom: -12vmax;
  border-color: rgba(212, 175, 55, .18);
  animation: floaty 14s ease-in-out infinite alternate;
}
.cursor-glow {
  position: fixed; left: 0; top: 0; z-index: -1;
  width: 560px; height: 560px; margin: -280px 0 0 -280px;
  border-radius: 50%; pointer-events: none; opacity: 0;
  background: radial-gradient(circle, rgba(212, 175, 55, .13), transparent 62%);
  transition: opacity .4s ease;
}
.progress {
  position: fixed; left: 0; right: 0; top: 0; z-index: 70; height: 3px;
  background: linear-gradient(90deg, #315EE7, #D4AF37);
  transform-origin: 0 50%; transform: scaleX(0);
  box-shadow: 0 0 12px rgba(212, 175, 55, .6);
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes floaty { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(34px, -26px, 0); } }

/* ---------- Layout ---------- */
.app {
  display: grid;
  grid-template-columns: 272px minmax(0, 1fr);
  min-height: 100vh;
}
.sidebar {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column;
  padding: 22px 16px;
  background: linear-gradient(172deg, #14246B 0%, #0B1437 100%);
  color: #E7ECFF;
  overflow: hidden;
  z-index: 40;
}
.brand {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  padding: 6px 8px 22px;
  margin-bottom: 18px;
  border-bottom: 1px solid rgba(212, 175, 55, .3);
  text-decoration: none;
}
.monogram {
  width: 44px; height: 44px; flex: none;
  display: grid; place-items: center;
  border-radius: 12px;
  font-family: var(--font-head); font-weight: 800; color: var(--midnight);
  background: linear-gradient(135deg, #F1D774, #D4AF37);
}
.brand-text strong {
  display: block;
  font-family: var(--font-head); font-size: 1rem; line-height: 1.2; color: #fff;
}
.brand-text > span {
  font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: #B9C6EE;
}
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-link {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  padding: 11px 12px;
  border-radius: 12px;
  color: #D6DEFA; text-decoration: none;
  font-weight: 500; font-size: .95rem;
  transition: background .2s ease, color .2s ease;
}
.nav-link:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.nav-link[aria-current="page"] {
  background: rgba(212, 175, 55, .14);
  color: #fff;
  box-shadow: inset 3px 0 0 var(--gold);
}
.nav-no {
  min-width: 24px;
  font-family: var(--font-head); font-weight: 700; font-size: .78rem;
  letter-spacing: .04em; color: var(--gold);
}
.nav-label { line-height: 1.3; }
.side-foot {
  margin-top: auto;
  display: flex; flex-direction: column; gap: 10px;
  padding-top: 16px;
}
.sidebar .btn-ghost {
  background: rgba(255, 255, 255, .06);
  color: #fff;
  border-color: rgba(212, 175, 55, .35);
}
.sidebar .btn-ghost:hover { background: rgba(255, 255, 255, .13); }

.main-col { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 12px;
  padding: 14px clamp(16px, 3vw, 40px);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.crumb {
  flex: 1; min-width: 0;
  font-size: .9rem; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.crumb b { color: var(--ink); font-weight: 600; }
main {
  width: 100%; max-width: 1200px; margin: 0 auto;
  padding: clamp(22px, 4vw, 48px) clamp(16px, 4vw, 48px) 72px;
}
.view { animation: fadeUp .55s cubic-bezier(.2, .7, .2, 1) both; }
.view > section + section { margin-top: clamp(40px, 6vw, 64px); }
.page-head {
  position: relative;
  display: grid; gap: 10px;
  margin-bottom: clamp(28px, 4vw, 44px);
  padding-bottom: 26px;
  border-bottom: 1px solid var(--line);
}
.page-head::after {
  content: ""; position: absolute; left: 0; bottom: -1px;
  width: 96px; height: 3px; border-radius: 3px; background: var(--gold);
}
.page-head p { max-width: 68ch; margin: 0; font-size: 1.05rem; color: var(--muted); }

.foot {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px;
  padding: 26px clamp(16px, 4vw, 48px);
  border-top: 1px solid var(--line);
  font-size: .88rem; color: var(--muted);
}

.icon-btn {
  flex: none;
  width: 42px; height: 42px;
  display: grid; place-items: center;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface); color: var(--ink);
  cursor: pointer;
  transition: border-color .2s ease, color .2s ease;
}
.icon-btn:hover { border-color: var(--accent); color: var(--link); }
.menu-btn { display: none; }
.ico-sun { display: none; }
[data-theme="dark"] .ico-sun { display: block; }
[data-theme="dark"] .ico-moon { display: none; }

.scrim {
  position: fixed; inset: 0; z-index: 35;
  background: rgba(7, 14, 38, .55);
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease;
}
.scrim.show { opacity: 1; pointer-events: auto; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 20px;
  border: 1px solid transparent; border-radius: 12px;
  font-family: var(--font-head); font-weight: 700; font-size: .95rem; line-height: 1.2;
  text-decoration: none; text-align: center;
  cursor: pointer;
  transition: transform .2s ease, background .2s ease, border-color .2s ease, color .2s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #2A52D0; color: #fff; }
.btn-gold { background: linear-gradient(135deg, #E9CB62, #D4AF37); color: var(--midnight); }
.btn-gold:hover { color: var(--midnight); }
.btn-outline { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-outline:hover { border-color: var(--accent); color: var(--link); }
.btn-ghost { color: #fff; }
.btn-sm { min-height: 36px; padding: 7px 14px; font-size: .85rem; }
.btn-block { width: 100%; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .55; cursor: not-allowed; transform: none; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 6px; }

/* ---------- Cards and grids ---------- */
.card {
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: clamp(20px, 2.4vw, 28px);
  box-shadow: var(--shadow);
  transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
}
@media (hover: hover) {
  .card-lift:hover { transform: translateY(-3px); border-color: rgba(49, 94, 231, .45); }
}
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.stack { display: grid; gap: 18px; }
.plain { list-style: none; padding: 0; }
.plain > li { padding: 9px 0; border-bottom: 1px solid var(--line); }
.plain > li:last-child { border-bottom: 0; }
.check > li { position: relative; padding-left: 24px; }
.check > li::before {
  content: ""; position: absolute; left: 0; top: 15px;
  width: 10px; height: 10px; border-radius: 3px; background: var(--gold);
}
.contact > li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; }
.official { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; }
.official h2 { margin-bottom: 4px; }
.official p { margin: 0; }
.empty {
  padding: 34px 20px; text-align: center; color: var(--muted);
  border: 1px dashed var(--line); border-radius: var(--radius);
}
.note-inline {
  margin: 0; padding: 9px 12px;
  font-size: .88rem; color: var(--muted);
  background: var(--bg); border-left: 3px solid var(--gold); border-radius: 8px;
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap; }
.row.wrap { justify-content: flex-start; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 6px 12px; border-radius: 999px;
  background: var(--bg); border: 1px solid var(--line);
  font-size: .87rem; color: var(--ink);
}

/* ---------- Badges and award tiers ---------- */
.badge {
  display: inline-flex; align-items: center;
  padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg); color: var(--muted);
  font-size: .78rem; font-weight: 600; line-height: 1.4;
  white-space: nowrap;
}
.b-level { color: var(--link); border-color: rgba(49, 94, 231, .3); background: rgba(49, 94, 231, .08); }
.b-cat { color: var(--muted); }
.b-type { color: var(--ink); }
.b-review { color: var(--link); border-color: rgba(49, 94, 231, .35); background: rgba(49, 94, 231, .08); }
.b-draft { color: var(--muted); }
.b-pending { color: var(--gold-ink); border-color: rgba(212, 175, 55, .55); background: rgba(212, 175, 55, .12); }

.award {
  display: inline-flex; align-items: center;
  margin: 0 8px 8px 0; padding: 6px 12px;
  border: 1px solid; border-radius: 10px;
  font-size: .84rem; font-weight: 600; line-height: 1.35;
}
.t-gold { background: linear-gradient(135deg, #FBF1C9, #F3DC8A); color: #5C4500; border-color: #D9B84A; }
.t-silver { background: linear-gradient(135deg, #F7F9FC, #DDE3EE); color: #2E3650; border-color: #B9C2D6; }
.t-bronze { background: linear-gradient(135deg, #F9EADB, #EBC9A6); color: #5E3212; border-color: #D6A77A; }
.t-special { background: #EAF0FE; color: #1F3FB0; border-color: #BCCBF5; }
[data-theme="dark"] .t-gold { background: rgba(212, 175, 55, .16); color: #F3D978; border-color: rgba(212, 175, 55, .5); }
[data-theme="dark"] .t-silver { background: rgba(190, 200, 225, .12); color: #E2E8F5; border-color: rgba(190, 200, 225, .4); }
[data-theme="dark"] .t-bronze { background: rgba(214, 150, 100, .14); color: #F0C49A; border-color: rgba(214, 150, 100, .45); }
[data-theme="dark"] .t-special { background: rgba(92, 130, 245, .16); color: #BCD0FF; border-color: rgba(92, 130, 245, .45); }

/* ---------- Teaching website spotlight ---------- */
.spotlight {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px 28px;
  padding: clamp(20px, 2.6vw, 30px);
  border-radius: var(--radius);
  border: 1px solid rgba(212, 175, 55, .7);
  background: linear-gradient(135deg, rgba(212, 175, 55, .14), rgba(49, 94, 231, .08));
  box-shadow: var(--shadow);
}
.spotlight-copy { min-width: 0; flex: 1 1 320px; }
.spotlight h2 { margin: 6px 0 6px; font-size: clamp(1.4rem, 2.6vw, 1.9rem); }
.spotlight p { margin: 0; }
.spotlight .eyebrow { margin-bottom: 0; }
.spotlight .btn { flex: none; }
@media (max-width: 680px) { .spotlight .btn { width: 100%; } }

/* ---------- Home hero ---------- */
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr);
  gap: clamp(28px, 5vw, 64px);
  align-items: center;
}
.eyebrow {
  font-family: var(--font-head); font-weight: 700; font-size: .8rem;
  letter-spacing: .16em; text-transform: uppercase; color: var(--gold-ink);
  margin-bottom: 12px;
}
.role {
  font-family: var(--font-head); font-weight: 600; font-size: 1.1rem;
  color: var(--link); margin-bottom: 14px;
}
.lead { font-size: 1.06rem; color: var(--ink); }
.meta {
  list-style: none; padding: 0; margin: 18px 0 24px;
  display: flex; flex-direction: column; gap: 6px;
  color: var(--muted); font-size: .95rem;
}
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; }
/* Profile photo: navy mat, white border with a thin gold inner line, orbiting gold dot */
.portrait-stage {
  position: relative; margin: 0;
  width: 100%; max-width: 330px; justify-self: center;
  padding: 16px; border-radius: 30px;
  background: linear-gradient(160deg, #1A2F7A 0%, #0B1437 100%);
  border: 1px solid rgba(212, 175, 55, .45);
  box-shadow: 0 30px 60px -30px rgba(11, 20, 55, .6);
}
.portrait-frame {
  position: relative; overflow: hidden;
  aspect-ratio: 553 / 627;
  border-radius: 20px;
  border: 5px solid #FFFFFF;
  box-shadow: inset 0 0 0 1px #D4AF37;
  background: var(--midnight);
}
.portrait-frame::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(110deg, transparent 35%, rgba(255, 255, 255, .35) 50%, transparent 65%);
  transform: translateX(-120%);
  animation: sweep 2.4s ease 1.3s 1 both;
}
.portrait-orbit {
  position: absolute; inset: -12px; border-radius: 38px; pointer-events: none;
  animation: spin 12s linear infinite;
}
.portrait-orbit::after {
  content: ""; position: absolute; right: -7px; bottom: -7px;
  width: 14px; height: 14px; border-radius: 50%;
  background: #D4AF37; box-shadow: 0 0 18px 4px rgba(212, 175, 55, .6);
}
@keyframes sweep { from { transform: translateX(-120%); } to { transform: translateX(120%); } }
.portrait-frame img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: 50% 22%;
}

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.kpi {
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 3px solid var(--gold);
  border-radius: 16px;
  padding: 20px;
  box-shadow: var(--shadow);
}
.kpi-v {
  display: block;
  font-family: var(--font-head); font-size: 2rem; font-weight: 800; line-height: 1.1;
  color: var(--ink);
}
.kpi-l { display: block; margin-top: 6px; font-size: .88rem; color: var(--muted); }
.kpis-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.plain.recent > li { font-size: .96rem; }
.nav-card {
  display: flex; flex-direction: column; gap: 6px;
  min-height: 176px;
  color: inherit; text-decoration: none;
}
.nav-card h3 { margin: 4px 0 0; }
.nav-card p { margin: 0; font-size: .94rem; }
.nav-card .more { margin-top: auto; padding-top: 8px; font-weight: 700; font-size: .92rem; color: var(--link); }

/* ---------- Profile ---------- */
.sub { margin: 24px 0 14px; font-size: 1rem; }
.skill { margin-bottom: 14px; }
.skill-top {
  display: flex; justify-content: space-between; gap: 12px;
  margin-bottom: 6px; font-size: .95rem; font-weight: 600;
}
.bar {
  height: 8px; overflow: hidden;
  border-radius: 99px; background: var(--bg); border: 1px solid var(--line);
}
.bar > span {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--gold));
  transform-origin: left center;
  animation: grow .9s ease .2s both;
}
.qual { display: flex; flex-direction: column; gap: 6px; }
.qual-year {
  font-family: var(--font-head); font-size: 1.9rem; font-weight: 800; line-height: 1;
  color: var(--gold-ink);
}
.qual p { margin: 0; }
.job { display: grid; gap: 10px; }
.job > p { margin: 0; }
.job-groups {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px 24px; margin-top: 12px;
}
.job-group h4 { color: var(--link); margin-bottom: 6px; font-size: .95rem; }

details > summary::after {
  content: "+"; font-size: 1.15rem; line-height: 1;

  width: 22px; height: 22px; border-radius: 6px;

.dl {

/* ---------- Toolbars and filters ---------- */

.field { min-width: 0; }

.field input, .field select {

.count { margin: 16px 2px 4px; font-size: .9rem; color: var(--muted); }

.pub > h3 { margin: 4px 0 0; }
.pub > p { margin: 0; }
.venue { font-weight: 600; color: var(--link); }
.pub .chips { margin-top: 2px; }

/* ---------- Achievements ---------- */
.year-group { margin-top: 34px; }
.year-group:first-child { margin-top: 0; }
.year-h {
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px;

}
.year-h span {

}
.ach-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.ach { display: flex; flex-direction: column; gap: 12px; padding: 22px; }
.ach-title { margin: 0; font-size: .98rem; line-height: 1.4; font-weight: 700; }
.awards { list-style: none; padding: 0; display: flex; flex-wrap: wrap; }
.ev-line {
  margin: auto 0 0; padding-top: 10px;
  border-top: 1px dashed var(--line);
  font-size: .86rem; color: var(--muted);
}

/* ---------- CV and evidence ---------- */
.ev-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }

.ev-count { font-family: var(--font-head); font-weight: 700; font-size: 1rem; color: var(--ink); }
.ev-card { display: grid; gap: 8px; }
.ev-card p { margin: 0; }

/* ---------- Notices, toast and back-to-top ---------- */
.to-top {
  position: fixed; right: 22px; bottom: 22px; z-index: 45;

}

.toast {

  font-size: .92rem; box-shadow: var(--shadow);

  function teachingSiteCard() {
    var t = P.teachingSite;
    return '<aside class="spotlight" aria-labelledby="site-title">' +
      '<div class="spotlight-copy"><span class="eyebrow">Personal teaching website</span>' +
      '<h2 id="site-title">' + esc(t.name) + '</h2>' +
      '<p class="muted">' + esc(t.title) + '. Hosted on GitHub Pages.</p>' +
      '<p class="fine">' + esc(t.url.replace('https://', '')) + '</p></div>' +
      '<a class="btn btn-gold" href="' + esc(t.url) + '" target="_blank" rel="noopener noreferrer">Visit ' + esc(t.name) + ' &nearr;</a>' +
      '</aside>';
  }

  function skill(s) {
    var pct = Math.round(s.score / s.max * 100);
    return '<div class="skill"><div class="skill-top"><span>' + esc(s.name) + '</span>' +
      '<span class="muted">' + s.score + ' / ' + s.max + '</span></div>' +
      '<div class="bar" role="img" aria-label="' + esc(s.name + ': ' + s.score + ' out of ' + s.max) + '">' +
      '<span style="width:' + pct + '%"></span></div></div>';
  }

  function qual(q) {
    return '<article class="card qual"><span class="qual-year">' + q.year + '</span>' +
      '<h3>' + esc(q.degree) + '</h3><p class="muted">' + esc(q.field) + '</p>' +
      '<p class="fine">' + esc(q.institution) + '</p>' +
      (q.cgpa ? '<span class="badge b-level" style="align-self:flex-start">CGPA ' + esc(q.cgpa) + '</span>' : '') +
      '</article>';
  }

  function job(j) {
    return '<article class="card job"><div class="row wrap"><h3>' + esc(j.role) + '</h3>' +
      '<span class="badge b-level">' + esc(j.start) + ' – ' + esc(j.end) + '</span></div>' +
      '<p class="muted">' + esc(j.org) + '</p>' +
      '<div class="job-groups">' + j.groups.map(function (g) {
        return '<div class="job-group"><h4>' + esc(g.heading) + '</h4><ul>' +
          g.items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></div>';
      }).join('') + '</div></article>';
  }

  function vProfile() {
    var o = P.owner;
    return pageHead('02', 'Academic Profile',
      'Qualifications, professional experience and research profile, drawn from the CV.') +
      '<section class="grid-2">' +
        '<article class="card"><h2>Biography</h2>' +
          P.bio.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('') + '</article>' +
        '<article class="card"><h2>Research interests</h2><div class="chips">' +
          P.researchInterests.map(chip).join('') + '</div>' +
          '<h3 class="sub">Technical skills</h3>' + P.skills.map(skill).join('') +
          '</article>' +
      '</section>' +
      '<section><h2>Qualifications</h2><div class="grid-3">' +
        P.qualifications.map(qual).join('') + '</div></section>' +
      '<section><h2>Professional experience</h2><div class="stack">' +
        P.employment.map(job).join('') + '</div></section>' +
      '<section class="card official"><div><h2>Official profile</h2>' +
        '<p class="muted">The IIUM staff profile is the institutional record for this post.</p></div>' +
        '<a class="btn btn-primary" href="' + esc(o.staffProfile) + '" target="_blank" rel="noopener noreferrer">' +
        'View IIUM staff profile &nearr;</a></section>';
  }

  function innCard(i) {
    return '<article class="card card-lift innov" id="' + esc(i.id) + '">' +
      '<h3>' + esc(i.name) + '</h3>' +
      (i.desc ? '<p class="muted innov-desc">' + esc(i.desc) + '</p>' : '') +
      (i.website
        ? '<a class="btn btn-gold innov-btn" href="' + esc(i.website) + '" target="_blank" rel="noopener noreferrer">' +
            'Visit ' + esc(i.name) + ' <span class="innov-arrow" aria-hidden="true">&nearr;</span></a>'
        : '<span class="pending">Link to be added</span>') +
      '</article>';
  }

  function vTeaching() {
    return pageHead('03', 'Teaching & Innovation',
      'Courses taught and educational innovation projects. Project details appear only where source material supports them.') +
      '<section>' + teachingSiteCard() + '</section>' +
      '<section><h2>Courses</h2><div class="grid-3">' +
        P.teachingCourses.map(function (c) {
          return '<article class="card"><span class="badge b-level">' + esc(c.code) + '</span>' +
            '<p class="course-note">' + esc(c.note) + '</p></article>';
        }).join('') + '</div></section>' +
      '<section><h2>Educational innovation projects</h2><div class="grid-2">' +
        P.innovations.map(innCard).join('') + '</div></section>';
  }

  function vResearch() {
    var pub = P.publications.filter(function (p) { return p.status === 'published'; }).length;
    var open = P.publications.length - pub;
    return pageHead('04', 'Research & Publications',
      'A searchable library of journal articles, conference papers and books.') +
      '<section class="kpis kpis-3">' +
        kpi(P.publications.length, 'Items listed') +
        kpi(pub, 'Published') +
        kpi(open, 'Under review or in preparation') +
      '</section>' +
      '<section><h2>Publications library</h2>' +
        '<div class="toolbar" role="search">' +
          '<div class="field"><label for="pub-year">Year</label><select id="pub-year" data-filter="pub" data-key="year">' +
            '<option value="all">All years</option>' +
            PUB_YEARS.map(function (y) { return '<option value="' + y + '">' + y + '</option>'; }).join('') +
          '</select></div>' +
          '<div class="field-btn"><button type="button" class="btn btn-outline btn-block" data-act="reset-pub">Reset</button></div>' +
        '</div>' +
        '<p class="count" id="pub-count" aria-live="polite"></p>' +
        '<div class="stack" id="pub-list"></div>' +
      '</section>';
  }

  function pubCard(p) {
    var draft = p.status === 'draft';
    return '<article class="card pub">' +
      '<div class="row wrap">' +
        '<span class="badge b-type">' + esc(TYPE[p.type] || p.type) + '</span>' +
        '<span class="badge ' + (draft ? 'b-draft' : 'b-review') + '">' + esc(PSTATUS[p.status] || p.status) + '</span>' +
        '<span class="badge">' + esc(p.year) + '</span>' +
      '</div>' +
      '<h3>' + esc(p.title) + '</h3>' +
      (isPending(p.authors) ? '' : '<p class="muted">' + esc(p.authors) + '</p>') +
      '<p class="venue">' + esc(p.venue) + '</p>' +
      (p.abstract ? '<p>' + pt(p.abstract, '') + '</p>' : '') +
      (p.keywords.length ? '<div class="chips">' + p.keywords.map(chip).join('') + '</div>' : '') +
      (p.indexing ? '<p class="fine">Indexing: ' + esc(p.indexing) + '</p>' : '') +
      (draft ? '<p class="note-inline">Citation incomplete: the final title and authors are to be confirmed before submission.</p>' : '') +
      '<div class="actions">' +
        (p.url
          ? '<a class="btn btn-gold btn-sm" href="' + esc(p.url) + '" target="_blank" rel="noopener noreferrer">Open link &nearr;</a>'
          : '<span class="pending">No DOI or link yet</span>') +
      '</div>' +
      '</article>';
  }

  function renderPubs() {
    var f = pubState;
    var list = P.publications.filter(function (p) {
      if (f.year !== 'all' && String(p.year) !== f.year) return false;
      return true;
    });
    $('#pub-count').textContent = 'Showing ' + list.length + ' of ' + P.publications.length + ' items';
    $('#pub-list').innerHTML = list.length
      ? list.map(pubCard).join('')
      : '<div class="empty">No publications match these filters. Try resetting the filters.</div>';
  }

  function selectField(id, label, opts, key) {
    return '<div class="field"><label for="' + id + '">' + label + '</label>' +
      '<select id="' + id + '" data-filter="ach" data-key="' + key + '">' +
      opts.map(function (o) { return '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>'; }).join('') +
      '</select></div>';
  }

  function achCard(a) {
    return '<article class="card ach">' +
      '<div class="row wrap"><span class="badge b-level">' + esc(LEVEL[a.level] || a.level) + '</span>' +
      '<span class="badge b-cat">' + esc(CAT[a.category] || a.category) + '</span></div>' +
      '<h4 class="ach-title">' + esc(a.title) + '</h4>' +
      '<ul class="awards">' + a.awards.map(function (x) {
        return '<li class="award t-' + x.tier + '">' + esc(x.name) + '</li>';
      }).join('') + '</ul>' +
      (a.link
        ? '<div class="ev-actions"><a class="btn btn-gold btn-sm" href="' + esc(a.link) + '" target="_blank" rel="noopener noreferrer">Evidence &nearr;</a></div>'
        : '<p class="ev-line">Evidence: <span class="pending">pending upload</span></p>') +
      '</article>';
  }

  function achFiltered() {
    var f = achState;
    var q = f.q.trim().toLowerCase();
    return ACH.filter(function (a) {
      if (f.year !== 'all' && String(a.year) !== f.year) return false;
      if (f.level !== 'all' && a.level !== f.level) return false;
      if (f.cat !== 'all' && a.category !== f.cat) return false;
      if (f.tier !== 'all' && !a.awards.some(function (x) { return x.tier === f.tier; })) return false;
      if (q) {
        var hay = [a.title, a.year, LEVEL[a.level] || a.level, CAT[a.category] || a.category,
          a.awards.map(function (x) { return x.name; }).join(' ')].join(' ').toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function renderAch() {
    var list = achFiltered();
    var awards = 0;
    list.forEach(function (a) { awards += a.awards.length; });
    $('#ach-count').textContent = 'Showing ' + list.length + ' of ' + ACH.length + ' competitions · ' +
      awards + ' awards';
    var groups = {};
    list.forEach(function (a) { (groups[a.year] = groups[a.year] || []).push(a); });
    var html = '';
    YEARS.forEach(function (y) {
      var g = groups[y];
      if (!g) return;
      html += '<section class="year-group"><h3 class="year-h">' + y +
        '<span>' + g.length + ' competition' + (g.length === 1 ? '' : 's') + '</span></h3>' +
        '<div class="ach-grid">' + g.map(achCard).join('') + '</div></section>';
    });
    $('#ach-list').innerHTML = html || '<div class="empty">No competitions match these filters. Try resetting the filters.</div>';
  }

  function leadCard(l) {
    var period = isPending(l.period)
      ? ''
      : '<span class="badge b-level">' + esc(l.period) + '</span>';
    return '<article class="card card-lift stack" style="gap:8px">' + period +
      '<h3>' + esc(l.role) + '</h3><p class="muted">' + esc(l.org) + '</p>' +
      (l.link ? '<div class="ev-actions"><a class="btn btn-gold btn-sm" href="' + esc(l.link) + '" target="_blank" rel="noopener noreferrer">Evidence &nearr;</a></div>' : '') +
      '</article>';
  }

  function vAchievements() {
    return pageHead('05', 'Achievements & Leadership',
      'A searchable record of ' + ACH.length + ' competitions and ' + AWARDS + ' awards from 2023 to 2026, with leadership roles and professional services. Titles and awards are reproduced from the CV.') +
      '<section class="kpis">' +
        kpi(ACH.length, 'Competitions') +
        kpi(AWARDS, 'Awards') +
        kpi(GOLD, 'Gold awards') +
        kpi(YEAR_RANGE, 'Years recorded') +
      '</section>' +
      '<section><h2>Competition gallery</h2>' +
        '<div class="toolbar" role="search">' +
          '<div class="field wide"><label for="ach-q">Search title, award or level</label>' +
            '<input id="ach-q" type="search" data-filter="ach" data-key="q" placeholder="e.g. gold, ICFSE, college"></div>' +
          selectField('ach-year', 'Year', [['all', 'All years']].concat(YEARS.map(function (y) { return [String(y), String(y)]; })), 'year') +
          selectField('ach-tier', 'Award tier', [['all', 'All tiers'], ['gold', 'Gold'], ['silver', 'Silver'], ['bronze', 'Bronze'], ['special', 'Recognition']], 'tier') +
          selectField('ach-level', 'Level', [['all', 'All levels']].concat(Object.keys(LEVEL).map(function (k) { return [k, LEVEL[k]]; })), 'level') +
          selectField('ach-cat', 'Category', [['all', 'All categories']].concat(Object.keys(CAT).map(function (k) { return [k, CAT[k]]; })), 'cat') +
          '<div class="field-btn"><button type="button" class="btn btn-outline btn-block" data-act="reset-ach">Reset filters</button></div>' +
        '</div>' +
        '<p class="count" id="ach-count" aria-live="polite"></p>' +
        '<div id="ach-list"></div>' +
      '</section>' +
      '<section><h2>Leadership</h2><div class="grid-2">' +
        P.leadership.map(leadCard).join('') + '</div></section>' +
      '<section><h2>Professional services</h2><article class="card">' +
        '<ul class="plain check">' + P.professionalServices.map(function (s) {
          return '<li>' + esc(s) + '</li>';
        }).join('') + '</ul></article></section>';
  }

  function vCV() {
    var o = P.owner;
    return pageHead('06', 'CV & Evidence',
      'Print or save the recruitment profile, check the status of supporting evidence, and get in touch.') +
      '<section class="grid-2">' +
        '<article class="card"><h2>Curriculum vitae</h2>' +
          '<p>A public copy of the CV has not yet been supplied, so no download is offered here.</p>' +
          '<div class="actions">' +
            '<button type="button" class="btn btn-outline" disabled aria-disabled="true">Download CV (file pending)</button>' +
            '<button type="button" class="btn btn-primary" data-act="print">Print recruitment profile</button>' +
          '</div>' +
          '<p class="fine" style="margin-top:14px">The printable profile is generated from the portfolio records. Use the print dialog to save it as PDF.</p>' +
        '</article>' +
        '<article class="card"><h2>Contact</h2>' +
          '<ul class="plain contact">' +
            '<li><span class="muted">Email</span><a href="mailto:' + esc(o.email) + '">' + esc(o.email) + '</a></li>' +
            '<li><span class="muted">Location</span><span>' + esc(o.location) + '</span></li>' +
            '<li><span class="muted">Profile</span><a href="' + esc(o.staffProfile) + '" target="_blank" rel="noopener noreferrer">IIUM staff profile &nearr;</a></li>' +
            '<li><span class="muted">Scholar</span><a href="' + esc(o.scholar) + '" target="_blank" rel="noopener noreferrer">Google Scholar &nearr;</a></li>' +
            '<li><span class="muted">Research</span><a href="' + esc(o.researchgate) + '" target="_blank" rel="noopener noreferrer">ResearchGate &nearr;</a></li>' +
          '</ul>' +
          '<div class="actions"><a class="btn btn-gold" href="mailto:' + esc(o.email) + '">Send an email</a></div>' +
          '<p class="fine" style="margin-top:14px">Referees are available on request.</p>' +
        '</article>' +
      '</section>';
  }

  /* ---------- Printable recruitment profile ---------- */
  function buildPrint() {
    var o = P.owner;
    var h = '<div class="pp-head"><h1>' + esc(o.fullName) + '</h1>' +
      '<p>' + esc(o.position) + '</p><p>' + esc(o.affiliation) + '</p>' +
      '<p>' + esc(o.email) + ' · ' + esc(o.location) + '</p></div>';
    h += '<h2>Professional summary</h2>' + P.bio.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('');
    h += '<h2>Qualifications</h2><table class="pp-table"><thead><tr><th>Year</th><th>Qualification</th><th>Field</th><th>Institution</th><th>CGPA</th></tr></thead><tbody>' +
      P.qualifications.map(function (q) {
        return '<tr><td>' + q.year + '</td><td>' + esc(q.degree) + '</td><td>' + esc(q.field) + '</td><td>' +
          esc(q.institution) + '</td><td>' + esc(q.cgpa || '—') + '</td></tr>';
      }).join('') + '</tbody></table>';
    h += '<h2>Professional experience</h2>' + P.employment.map(function (j) {
      return '<div class="pp-item"><h3>' + esc(j.role) + ' (' + esc(j.start) + ' to ' + esc(j.end) + ')</h3><p>' + esc(j.org) + '</p>' +
        j.groups.map(function (g) {
          return '<p><strong>' + esc(g.heading) + '</strong></p><ul>' +
            g.items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>';
        }).join('') + '</div>';
    }).join('');
    h += '<h2>Teaching</h2><ul>' + P.teachingCourses.map(function (c) {
      return '<li><strong>' + esc(c.code) + ':</strong> ' + esc(c.note) + '</li>';
    }).join('') + '<li><strong>Personal teaching website:</strong> ' + esc(P.teachingSite.name) + ' (' +
      esc(P.teachingSite.url) + ')</li></ul>';
    h += '<h2>Educational innovation projects</h2><ul>' + P.innovations.map(function (i) {
      return '<li><strong>' + esc(i.name) + '</strong>' + (i.website ? ': ' + esc(i.website) : '') + '</li>';
    }).join('') + '</ul>';
    h += '<h2>Publications</h2><ul>' + P.publications.map(function (p) {
      return '<li>' + esc(p.title) + '. ' + esc(p.venue) + '. <em>' + esc(PSTATUS[p.status] || p.status) + '</em></li>';
    }).join('') + '</ul>';
    h += '<h2>Leadership and professional services</h2><ul>' + P.leadership.map(function (l) {
      return '<li>' + esc(l.role) + ', ' + esc(l.org) + (isPending(l.period) ? '' : ' (' + esc(l.period) + ')') + '</li>';
    }).join('') + P.professionalServices.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>';
    h += '<h2>Competitions and awards</h2>' + YEARS.map(function (y) {
      return '<h3>' + y + '</h3><ul>' + ACH.filter(function (a) { return a.year === y; }).map(function (a) {
        return '<li>' + esc(a.title) + ' (' + esc(LEVEL[a.level] || a.level) + '): ' +
          esc(a.awards.map(function (x) { return x.name; }).join('; ')) + '</li>';
      }).join('') + '</ul>';
    }).join('');
    $('#print-profile').innerHTML = h;
  }

  /* ---------- Router and chrome ---------- */
  var VIEWS = { home: vHome, profile: vProfile, teaching: vTeaching, research: vResearch, achievements: vAchievements, cv: vCV };
  var AFTER = { research: renderPubs, achievements: renderAch };

  function currentRoute() {
    var h = (window.location.hash || '').replace(/^#\/?/, '');
    return Object.prototype.hasOwnProperty.call(VIEWS, h) ? h : 'home';
  }

  /* ---------- Motion helpers (skipped when reduced motion is requested) ---------- */
  var revealObserver = ('IntersectionObserver' in window)
    ? new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) {
            en.target.classList.add('in');
            revealObserver.unobserve(en.target);
          }
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' })
    : null;

  function enhance() {
    $$('.view .kpi').forEach(function (el, i) {
      el.style.setProperty('--d', (i * 90) + 'ms');
    });
    $$('.view > section').forEach(function (s) {
      if (s.classList.contains('hero') || REDUCED) return;
      s.classList.add('reveal');
      if (revealObserver) revealObserver.observe(s);
      else s.classList.add('in');
    });
    if (REDUCED) return;
    $$('[data-count]').forEach(function (el) {
      var end = parseInt(el.getAttribute('data-count'), 10);
      var t0 = null, dur = 1100;
      el.textContent = '0';
      function step(ts) {
        if (t0 === null) t0 = ts;
        var p = Math.min((ts - t0) / dur, 1);
        var eased = 1 - Math.pow(1 - p, 3);
        el.textContent = String(Math.round(end * eased));
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  function renderCurrent() {
    var r = currentRoute();
    $('#view').innerHTML = VIEWS[r]();
    if (AFTER[r]) AFTER[r]();
    enhance();
  }

  function renderNav() {
    $('#nav').innerHTML = NAV.map(function (n) {
      return '<a class="nav-link" href="#/' + n.id + '" data-id="' + n.id + '">' +
        '<span class="nav-no">' + n.no + '</span><span class="nav-label">' + esc(n.label) + '</span></a>';
    }).join('');
  }

  function markNav(r) {
    $$('.nav-link').forEach(function (a) {
      if (a.getAttribute('data-id') === r) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
  }

  function route() {
    var r = currentRoute();
    if (r === 'research') pubState = freshPub();
    if (r === 'achievements') achState = freshAch();
    renderCurrent();
    var n = NAV.filter(function (x) { return x.id === r; })[0];
    $('#crumb').innerHTML = '<span>Suhaila Bahrom</span> / <b>' + esc(n.no + ' ' + n.label) + '</b>';
    document.title = n.label + ' | Suhaila Bahrom';
    markNav(r);
    setMenu(false);
    window.scrollTo(0, 0);
    $('#main').focus({ preventScroll: true });
  }

  function setMenu(open) {
    $('#sidebar').classList.toggle('open', open);
    $('#scrim').classList.toggle('show', open);
    $('.menu-btn').setAttribute('aria-expanded', String(open));
  }
  function toggleMenu() { setMenu(!$('#sidebar').classList.contains('open')); }

  function setCollapsed(c) {
    $('#app').classList.toggle('collapsed', c);
    $('.collapse-btn').setAttribute('aria-expanded', String(!c));
    $('#collapse-label').textContent = c ? 'Expand menu' : 'Collapse menu';
    $('#collapse-ico').innerHTML = c ? '&raquo;' : '&laquo;';
    store('sb-collapsed', c ? '1' : '0');
  }
  function toggleCollapse() { setCollapsed(!$('#app').classList.contains('collapsed')); }

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    var label = t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
    $('#theme-btn').setAttribute('aria-label', label);
    $('#theme-btn').setAttribute('title', label);
    store('sb-theme', t);
  }
  function toggleTheme() {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  }

  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      toast(ok ? 'Citation copied to clipboard' : 'Copy is not available here. Select the citation text manually.');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast('Citation copied to clipboard');
      }, fallback);
    } else {
      fallback();
    }
  }

  function onScroll() {
    $('#to-top').classList.toggle('show', window.scrollY > 600);
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var prog = document.getElementById('progress');
    if (prog) prog.style.transform = 'scaleX(' + (max > 0 ? Math.min(window.scrollY / max, 1) : 0) + ')';
  }

  function onFilter(e) {
    var t = e.target;
    if (!t || !t.getAttribute) return;
    var scope = t.getAttribute('data-filter');
    if (!scope) return;
    var key = t.getAttribute('data-key');
    if (scope === 'pub') { pubState[key] = t.value; renderPubs(); }
    if (scope === 'ach') { achState[key] = t.value; renderAch(); }
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'menu') toggleMenu();
    else if (act === 'closeMenu') setMenu(false);
    else if (act === 'collapse') toggleCollapse();
    else if (act === 'theme') toggleTheme();
    else if (act === 'print') window.print();
    else if (act === 'top') window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
    else if (act === 'reset-pub') { pubState = freshPub(); renderCurrent(); }
    else if (act === 'reset-ach') { achState = freshAch(); renderCurrent(); }
  });

  document.addEventListener('input', onFilter);
  document.addEventListener('change', onFilter);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') setMenu(false);
  });
  window.addEventListener('hashchange', route);
  window.addEventListener('scroll', onScroll, { passive: true });

  function boot() {
    var saved = read('sb-theme');
    var dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    applyTheme(saved || (dark ? 'dark' : 'light'));
    renderNav();
    buildPrint();
    if (read('sb-collapsed') === '1' && window.innerWidth >= 960) setCollapsed(true);
    route();
    onScroll();
  }

  /* Pointer effects: cursor glow and card spotlight (fine pointers, motion allowed) */
  var canPoint = !!(window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches);
  if (canPoint && !REDUCED) {
    var glow = document.getElementById('cursor-glow');
    var raf = null, px = 0, py = 0;
    document.addEventListener('pointermove', function (e) {
      px = e.clientX; py = e.clientY;
      if (glow) glow.style.opacity = '1';
      var card = e.target.closest ? e.target.closest('.card') : null;
      if (card) {
        var r = card.getBoundingClientRect();
        card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        card.style.setProperty('--my', (e.clientY - r.top) + 'px');
      }
      if (raf === null) {
        raf = requestAnimationFrame(function () {
          raf = null;
          if (glow) glow.style.transform = 'translate3d(' + px + 'px,' + py + 'px,0)';
        });
      }
    }, { passive: true });
  }

  boot();
})();
</script>
</body>
</html>
